<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-container">
    <main class="left-pane">
        <header class="pane-header">
            <h1>Inbox</h1>
        </header>

        <form class="add-task-box" id="add-task-form">
            <input type="text" id="task-title-input" class="task-title-input" placeholder="Title" required />
            <textarea id="task-desc-input" class="task-desc-input" placeholder="Description" rows="2"></textarea>

            <div class="add-task-footer">
                <div class="add-task-controls">
                    <select id="subject-select" class="control-select" required>
                        <option value="" disabled selected>Subject</option>
                        <option value="Organismos">Organismos</option>
                        <option value="Probabilidad y Estadistica">Probabilidad y Estadistica</option>
                        <option value="Ingles VI">Ingles VI</option>
                        <option value="Historia III">Historia III</option>
                        <option value="Humanidades III">Humanidades III</option>
                        <option value="Programacion Movil I">Programacion Movil I</option>
                        <option value="Sistemas Embebidos I">Sistemas Embebidos I</option>
                        <option value="Modelos y Metodos de Desarrollo de Software II">Modelos y Metodos de Desarrollo de Software II</option>
                        <option value="Programacion Web I">Programacion Web I</option>
                    </select>

                    <select id="priority-select" class="control-select" required>
                        <option value="" disabled selected>Priority</option>
                        <option value="low">🔵 Low</option>
                        <option value="medium">🟡 Medium</option>
                        <option value="high">🔴 High</option>
                    </select>
                </div>

                <button type="submit" class="btn-add">Add</button>
            </div>
        </form>

        <section class="task-section">
            <div class="section-header">
                <span class="section-title">Pending</span>
                <span class="section-count" id="count-pending">0</span>
            </div>
            <ul class="task-list" id="list-pending"></ul>
        </section>

        <section class="task-section">
            <div class="section-header">
                <span class="section-title">In Progress</span>
                <span class="section-count" id="count-in-progress">0</span>
            </div>
            <ul class="task-list" id="list-in-progress"></ul>
        </section>

        <section class="task-section" id="section-completed">
            <div class="section-header">
                <span class="section-title">Completed</span>
                <span class="section-count" id="count-completed">0</span>
            </div>
            <ul class="task-list" id="list-completed"></ul>
        </section>
    </main>

    <aside class="right-pane">
        <div class="task-detail hidden" id="task-detail-content">
            <input type="text" id="detail-title-input" class="detail-title-input" placeholder="Task title" readonly />
            <textarea id="detail-description-input" class="detail-description-input" placeholder="Add a description..." readonly></textarea>
            <button type="button" id="btn-save-changes" class="btn-save hidden">Save Changes</button>
        </div>
    </aside>
</div>

<script src="app.js"></script>
</body>
</html>
